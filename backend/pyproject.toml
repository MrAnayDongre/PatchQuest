[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchquest"
version = "0.1.0"
description = "Local-first agentic coding harness with deterministic orchestration, repo memory, and safety gates"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "aiosqlite>=0.19.0",
    "pyyaml>=6.0",
    "sse-starlette>=1.8.0",
    "httpx>=0.25.0",
]

[project.scripts]
patchquest = "patchquest.cli:main"

[project.optional-dependencies]
tree-sitter = [
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-c>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-java>=0.23.0",
]
caldav = [
    "caldav>=1.3.0",
]
google-calendar = [
    "google-api-python-client>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
]
all = [
    "patchquest[tree-sitter,caldav,google-calendar]",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "docker: needs a reachable Docker daemon and the patchquest-sandbox image (skipped otherwise)",
    "live: talks to a real model endpoint; never run by default",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "build", "tests/fixtures"]

[tool.ruff.lint]
# E/F/W correctness, I imports, B bugbear, UP modernisation, ASYNC blocking-in-async,
# S security (bandit), RUF misc. Deliberately not "ALL": every rule here is enforced in CI.
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = [
    "E501",    # long lines are formatter territory
    "S608",    # SQL built from internal constants only (reviewed)
    "RUF012",  # pydantic/dataclass mutable defaults are handled by the frameworks
    "UP042",   # (str, Enum) is kept on purpose: str() output is stable across Python versions
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S103", "S104", "S105", "S106", "S108", "S603", "S607", "ASYNC", "B011", "RUF001", "RUF059"]
# The executor and runtimes exist to launch subprocesses; policy lives in tools/command_risk.py.
"patchquest/execution/*" = ["S603", "S607"]
"patchquest/runtime/*" = ["S603", "S607"]
"patchquest/tools/*" = ["S603", "S607"]
"patchquest/doctor.py" = ["S603", "S607"]
# These hold environment-variable *names* (e.g. api_token_env), not secrets.
"patchquest/config.py" = ["S105", "S106"]
"patchquest/calendar/providers/*" = ["S107"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
files = ["patchquest"]
