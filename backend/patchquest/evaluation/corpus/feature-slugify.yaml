oracle:
  command: python3 -m unittest discover -s tests -q
  files:
    tests/test_textutils_oracle.py: |
      import os, sys, unittest
      sys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))

      from textutils import shout, slugify


      class O(unittest.TestCase):
          def test_edge_cases(self):
              self.assertEqual(slugify("  --Many   spaces & symbols__ "), "many-spaces-symbols")
              self.assertEqual(slugify("Already-a-slug"), "already-a-slug")
              self.assertEqual(slugify("***"), "")

          def test_existing_function_untouched(self):
              self.assertEqual(shout("a"), "A")
solution:
  files_to_inspect:
  - textutils.py
  edits:
  - path: textutils.py
    search: |
      def shout(text):
          return text.upper()
    replace: |
      import re


      def shout(text):
          return text.upper()


      def slugify(text):
          return re.sub(r"[^a-z0-9]+", "-", text.lower()).strip("-")
