schema: 1
id: bugfix-pagination-off-by-one
category: bug_fix
difficulty: easy
task: 'paginate() in pager.py is wrong: pages are numbered from 1, but page 1 currently returns the second
  page of items. Fix it.'
files:
  pager.py: |
    def paginate(items, page, size):
        """Return the items on `page` (1-indexed) for pages of `size` items."""
        start = page * size
        return items[start:start + size]
  tests/test_pager.py: |
    import os, sys, unittest
    sys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))

    from pager import paginate


    class T(unittest.TestCase):
        def test_first_page(self):
            self.assertEqual(paginate(list(range(10)), 1, 3), [0, 1, 2])
test_command: python3 -m unittest discover -s tests -q
oracle:
  command: python3 -m unittest discover -s tests -q
  files:
    tests/test_pager_oracle.py: |
      import os, sys, unittest
      sys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))

      from pager import paginate


      class O(unittest.TestCase):
          def test_middle_and_partial_last_page(self):
              data = list(range(10))
              self.assertEqual(paginate(data, 2, 3), [3, 4, 5])
              self.assertEqual(paginate(data, 4, 3), [9])

          def test_past_the_end_is_empty(self):
              self.assertEqual(paginate(list(range(5)), 3, 3), [])
solution:
  files_to_inspect:
  - pager.py
  edits:
  - path: pager.py
    search: |2-
          start = page * size
    replace: |2-
          start = (page - 1) * size
  create: []
