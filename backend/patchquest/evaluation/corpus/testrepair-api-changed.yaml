schema: 1
id: testrepair-api-changed
category: test_repair
difficulty: medium
task: The tests in tests/test_connection.py fail because connect() now takes a single 'host:port' string
  instead of two arguments. Fix the TESTS to use the new API. Do not change connection.py.
files:
  connection.py: |
    def connect(address):
        """Return (host, port) parsed from 'host:port'."""
        host, _, port = address.partition(":")
        return host, int(port)
  tests/test_connection.py: |
    import os, sys, unittest
    sys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))

    from connection import connect


    class T(unittest.TestCase):
        def test_connect(self):
            self.assertEqual(connect("localhost", 8080), ("localhost", 8080))

        def test_connect_other_port(self):
            self.assertEqual(connect("example.org", 443), ("example.org", 443))
test_command: python3 -m unittest discover -s tests -q
oracle:
  command: python3 -m unittest discover -s tests -q
  files:
    tests/test_connection_oracle.py: |
      import os, sys, unittest
      sys.path.insert(0, os.path.dirname(os.path.dirname(os.path.abspath(__file__))))

      from connection import connect


      class O(unittest.TestCase):
          def test_api(self):
              self.assertEqual(connect("a:1"), ("a", 1))
  forbid_changes:
  - connection.py
solution:
  files_to_inspect:
  - tests/test_connection.py
  - tests/test_connection.py
  edits:
  - path: tests/test_connection.py
    search: |-
      connect("localhost", 8080)
    replace: |-
      connect("localhost:8080")
  - path: tests/test_connection.py
    search: |-
      connect("example.org", 443)
    replace: |-
      connect("example.org:443")
  create: []
