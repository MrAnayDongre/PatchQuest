# Version-update PRs are paused (open-pull-requests-limit: 0) while the project is parked.
# Dependabot security alerts and security updates are separate repository settings and are not affected.
# To resume: set the limits back to 2.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
    groups:
      python-dependencies:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
    # Major upgrades (TypeScript, React, ...) are migrations to do deliberately, not unattended bumps.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-dependencies:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
