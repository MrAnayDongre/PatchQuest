name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: lint + types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,tree-sitter]"
      - run: ruff check .
      - run: mypy

  unit:
    name: unit (py${{ matrix.python }})
    needs: [static]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,tree-sitter]"
      - run: pytest tests/unit -q

  integration:
    needs: [unit]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pip install -e ".[dev,tree-sitter]"
      - run: pytest tests/integration -q -m "not docker"

  e2e:
    name: e2e workflows
    needs: [unit]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pip install -e ".[dev,tree-sitter]"
      - run: pytest tests/e2e -q

  security:
    name: security (tenant isolation, authz, webhooks, SSRF)
    needs: [unit]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,tree-sitter]"
      - run: pytest tests/security tests/unit/connectors -q

  sandbox:
    name: sandbox (real containers)
    needs: [unit]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: docker build -t patchquest-sandbox:latest ../docker/sandbox
      - run: pip install -e ".[dev,tree-sitter]"
      - run: pytest -m docker -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    name: wheel installs and runs from a clean environment
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: scripts/clean_install_check.sh

  container:
    name: image builds, starts, and serves the UI and API
    runs-on: ubuntu-latest
    needs: [frontend, unit]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t patchquest-ci .
      - name: Start and probe
        run: |
          docker volume create pq-ci
          TOKEN=$(docker run --rm -v pq-ci:/data patchquest-ci patchquest admin init --org Ci --workspace main --owner ci --json | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
          docker run -d --name pq -p 127.0.0.1:18000:8000 -e PATCHQUEST_QUEUE_MODE=true -v pq-ci:/data patchquest-ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18000/ready >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:18000/ready
          curl -sf http://127.0.0.1:18000/ | grep -qi "<html"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18000/api/runs)" = 401
          curl -sf -H "Authorization: Bearer $TOKEN" http://127.0.0.1:18000/api/runs
