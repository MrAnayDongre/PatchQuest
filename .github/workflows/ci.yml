name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: lint + types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,tree-sitter]"
      - run: ruff check patchquest tests
      - run: mypy

  unit:
    name: unit (py${{ matrix.python }})
    needs: [static]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,tree-sitter]"
      - run: pytest tests/unit -q

  integration:
    needs: [unit]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pip install -e ".[dev,tree-sitter]"
      - run: pytest tests/integration -q -m "not docker"

  e2e:
    name: e2e workflows
    needs: [unit]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pip install -e ".[dev,tree-sitter]"
      - run: pytest tests/e2e -q

  sandbox:
    name: sandbox (real containers)
    needs: [unit]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: docker build -t patchquest-sandbox:latest ../docker/sandbox
      - run: pip install -e ".[dev,tree-sitter]"
      - run: pytest -m docker -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    name: wheel installs and runs from a clean environment
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: pip wheel ./backend --no-deps -w dist
      - name: Install into a fresh venv and smoke test
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          mkdir /tmp/proj && printf '# smoke\n' > /tmp/proj/README.md
          cd /tmp/proj
          /tmp/clean/bin/patchquest doctor
          /tmp/clean/bin/patchquest run --repo /tmp/proj --task 'Add exactly this sentence to README.md: "CI smoke."' --no-input
          grep -q "CI smoke." README.md
