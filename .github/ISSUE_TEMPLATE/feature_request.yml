name: Feature request
description: Propose a capability or a change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
      description: What should PatchQuest do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: implications
    attributes:
      label: Runtime and security implications
      description: Does it write anywhere, send data out, run commands, change recovery or replay behavior, or need a new permission?
  - type: checkboxes
    id: contribute
    attributes:
      label: Would you like to work on it?
      options:
        - label: I can help implement or test this
